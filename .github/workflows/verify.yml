name: Verify engineering preview
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - run: node scripts/verify.js
      - run: node scripts/requirements.js
      - name: Operational smoke check (every connector, page and API)
        run: node scripts/smoke.js
      - name: Validate Windows exporter syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/Export-WindowsEvents.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw 'PowerShell syntax validation failed' }
      - name: Validate every PowerShell script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bad = 0
          foreach ($file in Get-ChildItem -Path scripts -Recurse -Filter *.ps1) {
            $parseErrors = $null; $parseTokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { foreach ($pe in $parseErrors) { Write-Output "::error file=scripts/$($file.Name),line=$($pe.Extent.StartLineNumber),title=PowerShell $($PSVersionTable.PSVersion) parse error::$($pe.Message)" }; $bad++ } else { Write-Output "syntax ok: $($file.Name)" }
          }
          if ($bad -gt 0) { throw 'PowerShell syntax validation failed' }
      - name: Run Windows collectors for real and ingest their output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cg-collectors'; New-Item -ItemType Directory -Force $out | Out-Null
          ./scripts/agent/CyberGuard-Agent.ps1 -OutputPath "$out/agent.json" -EnrolledBy 'github-actions'
          ./scripts/Export-SoftwareInventory.ps1 -OutputPath "$out/software.json"
          ./scripts/Export-IdentitySnapshot.ps1 -OutputPath "$out/identity.json"
          ./scripts/Export-AccountPosture.ps1 -OutputPath "$out/posture.json"
          ./scripts/Export-ConnectionEvidence.ps1 -OutputPath "$out/connections.json"
          ./scripts/Export-FirewallRules.ps1 -OutputPath "$out/firewall.json"
          ./scripts/Export-HostNetworkConfig.ps1 -OutputPath "$out/hostcfg.json"
          $watched = Join-Path $out 'watched'; New-Item -ItemType Directory -Force $watched | Out-Null
          'v1' | Out-File "$watched/a.txt"; 'old' | Out-File "$watched/old.txt"
          ./scripts/Watch-SensitiveChanges.ps1 -StatePath "$out/state.json" -OutputPath "$out/changes-baseline.json" -WatchPath $watched
          'v2' | Out-File "$watched/a.txt"; 'new' | Out-File "$watched/new.txt"; Remove-Item "$watched/old.txt"
          ./scripts/Watch-SensitiveChanges.ps1 -StatePath "$out/state.json" -OutputPath "$out/changes.json" -WatchPath $watched
          $files = @("$out/agent.json", "$out/software.json", "$out/identity.json", "$out/posture.json", "$out/connections.json", "$out/firewall.json", "$out/hostcfg.json", "$out/changes.json")
          try { ./scripts/Export-LocalDiscovery.ps1 -OutputPath "$out/discovery.json" -AuthorizationRef 'github-actions-runner-self'; $files += "$out/discovery.json" } catch { Write-Output "discovery skipped: $($_.Exception.Message)" }
          try { ./scripts/Export-WindowsEvents.ps1 -OutputPath "$out/winevents.json" -Hours 24; $files += "$out/winevents.json" } catch { Write-Output "windows events: $($_.Exception.Message)" }
          ./scripts/Invoke-LowImpactValidation.ps1 -PlanId 'ci-low-impact' -OutputPath "$out/validation.json" -ExecutedBy 'github-actions'; $files += "$out/validation.json"
          ./scripts/Probe-LocalCapabilities.ps1 -OutputPath "$out/capabilities.json"; $files += "$out/capabilities.json"
          node scripts/ci-collector-check.js @files
      - name: Emulate password guessing in the disposable runner and measure detection (CG-027)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'cg-detection'; New-Item -ItemType Directory -Force $out | Out-Null
          $start = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          # Six failed network logons for an account that does not exist, each with a fresh random password.
          1..6 | ForEach-Object { $bad = [guid]::NewGuid().ToString(); cmd /c "net use \\127.0.0.1\IPC`$ /user:cg-lab-nouser $bad >nul 2>&1"; cmd /c "net use \\127.0.0.1\IPC`$ /delete >nul 2>&1" }
          Start-Sleep -Seconds 5
          $end = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          ./scripts/Export-WindowsEvents.ps1 -OutputPath "$out/winevents.json" -Hours 1
          node scripts/ci-detection-exercise.js --computer ([System.Net.Dns]::GetHostName()) --start $start --end $end --events "$out/winevents.json"
      - name: Convert the runner's real iptables ruleset (CG-043)
        if: runner.os == 'Linux'
        run: |
          sudo iptables-save > "$RUNNER_TEMP/iptables-save.txt"
          if grep -q '^*filter' "$RUNNER_TEMP/iptables-save.txt"; then
            node scripts/firewall-policy-to-telemetry.js iptables "$RUNNER_TEMP/iptables-save.txt" "$RUNNER_TEMP/iptables.json" github-runner
            node scripts/ci-collector-check.js "$RUNNER_TEMP/iptables.json"
          else
            echo "iptables-save has no filter table on this runner"
          fi
      - name: Run the Linux agent for real and ingest its output
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/agent/cyberguard-agent.sh
          bash scripts/agent/cyberguard-agent.sh "$RUNNER_TEMP/agent.json" github-actions 60
          journalctl -n 500 -o short-iso --no-pager > "$RUNNER_TEMP/journal.log" || true
          node scripts/logs-to-telemetry.js journal "$RUNNER_TEMP/journal.log" "$RUNNER_TEMP/journal.json" github-runner-journal
          node scripts/ci-collector-check.js "$RUNNER_TEMP/agent.json" "$RUNNER_TEMP/journal.json"
      - name: Install and run CyberGuard as a hardened systemd service on Linux
        if: runner.os == 'Linux'
        run: |
          sh -n deploy/linux/install.sh
          sudo sh deploy/linux/install.sh
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4310/api/health >/dev/null 2>&1 && break; sleep 1; done
          systemctl is-active cyberguard
          curl -fsS http://127.0.0.1:4310/api/health | grep -q '"status":"running"'
          curl -fsS http://127.0.0.1:4310/api/setup/status | grep -q '"setup_required":true'
          sudo test -f /var/lib/cyberguard/setup-token
          test "$(sudo stat -c %U /var/lib/cyberguard)" = cyberguard
          if curl -fsS --max-time 3 "http://$(hostname -I | awk '{print $1}'):4310/api/health"; then echo 'CyberGuard must not listen beyond loopback'; exit 1; fi
          sudo systemd-analyze security cyberguard --no-pager | tail -1
      - name: Run two isolated tenants as separate systemd services on Linux (CG-059)
        if: runner.os == 'Linux'
        run: |
          sh -n deploy/linux/add-tenant.sh
          sudo sh deploy/linux/add-tenant.sh acme-bank 4411
          sudo sh deploy/linux/add-tenant.sh north-clinic 4412
          if sudo sh deploy/linux/add-tenant.sh other-co 4411; then echo 'a used port must be refused'; exit 1; fi
          for p in 4411 4412; do for i in $(seq 1 30); do curl -fsS http://127.0.0.1:$p/api/health >/dev/null 2>&1 && break; sleep 1; done; curl -fsS http://127.0.0.1:$p/api/setup/status | grep -q '"setup_required":true'; done
          systemctl is-active cyberguard@acme-bank cyberguard@north-clinic
          A=$(sudo stat -c %u /var/lib/private/cyberguard-tenants/acme-bank); B=$(sudo stat -c %u /var/lib/private/cyberguard-tenants/north-clinic)
          test "$A" != "$B" && test "$A" != 0 && test "$B" != 0
          sudo test -f /var/lib/private/cyberguard-tenants/acme-bank/cyberguard.sqlite
          sudo test -f /var/lib/private/cyberguard-tenants/north-clinic/cyberguard.sqlite
          test "$(sudo cat /var/lib/private/cyberguard-tenants/acme-bank/setup-token)" != "$(sudo cat /var/lib/private/cyberguard-tenants/north-clinic/setup-token)"
          sudo systemd-analyze security cyberguard@acme-bank --no-pager | tail -1
